name: Batter Motion Loop V2 QA

on:
  push:
    branches:
      - codex/batter-motion-loop-v2
    paths:
      - src/duel/App.jsx
      - src/duel/batterMotionV2.js
      - src/duel/golden-master.css
      - tests/main-batter-standin.test.js
      - tests/duel-ui.test.jsx
      - scripts/generate-batter-motion-v2.py
      - scripts/capture-batter-motion-v2.mjs
      - tests/batter-motion-v2.test.js
      - .github/workflows/batter-motion-loop-v2-qa.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author-verify-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out batter motion v2
        uses: actions/checkout@v4
        with:
          ref: codex/batter-motion-loop-v2

      - name: Install pose authoring dependencies
        run: python3 -m pip install --disable-pip-version-check pillow opencv-python-headless scipy

      - name: Export authored intermediate poses
        run: python3 scripts/generate-batter-motion-v2.py

      - name: Verify eight 192x192 PNG assets exist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          assets=[
            Path('assets/batter-reboot-v1/batter-ready.png'),
            Path('assets/batter-reboot-v2/batter-load.png'),
            Path('assets/batter-reboot-v1/batter-trigger.png'),
            Path('assets/batter-reboot-v2/batter-swing-start.png'),
            Path('assets/batter-reboot-v1/batter-contact.png'),
            Path('assets/batter-reboot-v2/batter-follow-through-early.png'),
            Path('assets/batter-reboot-v1/batter-finish.png'),
            Path('assets/batter-reboot-v2/batter-settle.png'),
          ]
          for asset in assets:
            im=Image.open(asset)
            assert im.size==(192,192), (asset,im.size)
            print(asset,im.size)
          PY

      - name: Persist V2 authored PNG exports on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/batter-reboot-v2
          if ! git diff --cached --quiet; then
            git commit -m "art: export batter motion v2 intermediate poses"
            git push origin HEAD:codex/batter-motion-loop-v2
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run smoke reports
        run: |
          node scripts/zone-report.js 10
          node scripts/v9-report.js 30
          node scripts/growth-report.js 2
          node scripts/deck-report.js 1

      - name: Build production bundle
        env:
          VITE_BASE: /
        run: pnpm run build

      - name: Install Playwright for visual QA
        run: |
          pnpm add -D playwright@1.55.0 --ignore-workspace-root-check --lockfile=false
          pnpm exec playwright install --with-deps chromium

      - name: Start preview server
        env:
          VITE_BASE: /
        run: |
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/batter-motion-v2-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/batter-motion-v2-preview.log
          exit 1

      - name: Capture required motion and viewports
        env:
          BASE_URL: http://127.0.0.1:4173/
          QA_OUT: qa/batter-motion-loop-v2
        run: node scripts/capture-batter-motion-v2.mjs

      - name: Persist visual QA evidence on branch
        if: success()
        run: |
          git add qa/batter-motion-loop-v2
          if ! git diff --cached --quiet; then
            git commit -m "qa: capture batter motion v2 key poses"
            git push origin HEAD:codex/batter-motion-loop-v2
          fi

      - name: Upload batter motion V2 QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batter-motion-loop-v2-captures
          path: qa/batter-motion-loop-v2
          if-no-files-found: warn
