name: V12 P0 Verify

on:
  push:
    branches:
      - claude/feedback-review-plan-vw24at

permissions:
  contents: write

jobs:
  baseline-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen pre-P0 baseline
        uses: actions/checkout@v6
        with:
          ref: a1cbf625fa558bb463999fee47998868d155fcb4
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install baseline dependencies
        run: pnpm install --frozen-lockfile

      - name: Record frozen-baseline full-suite result without changing the current gate
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee baseline-test.log
          code=${PIPESTATUS[0]}
          echo "${code}" > baseline-test-exit.txt
          echo "Frozen baseline pnpm test exit=${code}"
          exit 0

      - name: Upload baseline diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v12-p0-1-frozen-baseline-test
          path: |
            baseline-test.log
            baseline-test-exit.txt

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V12 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize deterministic V12 fixture
        run: |
          node scripts/v12-baseline.mjs --write
          git add --intent-to-add docs/design/v12/fixtures/p0-1-combat.json

      - name: Check baseline fixture against engine
        run: node scripts/v12-baseline.mjs --check

      - name: Run full tests
        run: pnpm test

      - name: Build production site
        run: pnpm build

      - name: Zone report 30
        run: node scripts/zone-report.js 30 | tee v12-zone-report.txt

      - name: V12 static and engine audit
        run: node docs/design/v12/audit-static-and-engine.mjs | tee v12-audit.txt

      - name: Commit deterministic fixture only after mandatory checks pass
        shell: bash
        run: |
          git add docs/design/v12/fixtures/p0-1-combat.json
          if git diff --cached --quiet; then
            echo "Fixture already committed; no fixture commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test(v12-P0): commit deterministic combat baseline fixture"
            git push origin HEAD:claude/feedback-review-plan-vw24at
          fi

      - name: Install Playwright for review capture only
        run: |
          pnpm add --save-dev --ignore-workspace-root-check playwright
          pnpm exec playwright install --with-deps chromium

      - name: Start Vite on 5177
        run: |
          pnpm dev --host 127.0.0.1 --port 5177 --strictPort > /tmp/v12-dev.log 2>&1 &
          echo $! > /tmp/v12-dev.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5177/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v12-dev.log
          exit 1

      - name: Capture three P0-1 review viewports
        run: node scripts/v12-baseline.mjs --capture .qa-v12-p0-1

      - name: Upload P0-1 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-p0-1-verification
          path: |
            .qa-v12-p0-1
            v12-zone-report.txt
            v12-audit.txt
            /tmp/v12-dev.log
