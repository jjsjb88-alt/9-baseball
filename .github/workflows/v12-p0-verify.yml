name: V12 P0 Verify

on:
  push:
    branches:
      - claude/feedback-review-plan-vw24at

permissions:
  contents: read

jobs:
  baseline-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen pre-P0 baseline
        uses: actions/checkout@v6
        with:
          ref: a1cbf625fa558bb463999fee47998868d155fcb4
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install baseline dependencies
        run: pnpm install --frozen-lockfile

      - name: Record frozen-baseline full-suite result without changing the current gate
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee baseline-test.log
          code=${PIPESTATUS[0]}
          echo "${code}" > baseline-test-exit.txt
          echo "Frozen baseline pnpm test exit=${code}"
          exit 0

      - name: Upload baseline diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v12-p0-1-frozen-baseline-test
          path: |
            baseline-test.log
            baseline-test-exit.txt

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V12 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize deterministic V12 fixture
        run: node scripts/v12-baseline.mjs --write

      - name: Check baseline fixture against engine
        run: node scripts/v12-baseline.mjs --check

      - name: Run full tests
        run: pnpm test

      - name: Build production site
        run: pnpm build

      - name: Zone report 30
        run: node scripts/zone-report.js 30 | tee v12-zone-report.txt

      - name: Prove zone report is unchanged from frozen pre-P0 baseline
        shell: bash
        run: |
          git worktree add --detach /tmp/v12-p0-baseline a1cbf625fa558bb463999fee47998868d155fcb4
          (cd /tmp/v12-p0-baseline && node scripts/zone-report.js 30) > v12-zone-report-baseline.txt
          diff -u v12-zone-report-baseline.txt v12-zone-report.txt
          git worktree remove /tmp/v12-p0-baseline

      - name: V12 static and engine audit
        run: node docs/design/v12/audit-static-and-engine.mjs | tee v12-audit.txt

      - name: Prove committed fixture is reproducible
        run: |
          git diff --exit-code -- docs/design/v12/fixtures/p0-1-combat.json
          git ls-files --error-unmatch docs/design/v12/fixtures/p0-1-combat.json

      - name: Install Playwright for P0-2 review capture
        run: |
          pnpm add --save-dev --ignore-workspace-root-check playwright
          pnpm exec playwright install --with-deps chromium

      - name: Start Vite on 5177 for P0-2 review
        run: |
          pnpm dev --host 127.0.0.1 --port 5177 --strictPort > /tmp/v12-dev.log 2>&1 &
          echo $! > /tmp/v12-dev.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5177/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v12-dev.log
          exit 1

      - name: Re-capture three P0-2 review viewports
        run: node scripts/v12-baseline.mjs --capture-before v12-p0-2-captures

      - name: Prove P0 screen stayed within the measured capture-noise envelope
        run: node scripts/v12-p0-screen-diff.mjs docs/design/v12/shots v12-p0-2-captures | tee v12-p0-screen-diff.json

      - name: Upload P0-2 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-p0-2-verification
          path: |
            v12-p0-2-captures
            v12-zone-report.txt
            v12-zone-report-baseline.txt
            v12-audit.txt
            v12-p0-screen-diff.json
            /tmp/v12-dev.log
