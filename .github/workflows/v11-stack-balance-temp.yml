name: TEMP V11 Stack Balance Report

on:
  push:
    branches:
      - codex/v11-stack-balance-report

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stack report
        run: node scripts/report-v11-stack.mjs 80 140
      - name: Tests
        run: pnpm test -- tests/v11-stack-balance.test.js tests/v11-stack-order.test.js
      - name: Build
        run: pnpm run build
