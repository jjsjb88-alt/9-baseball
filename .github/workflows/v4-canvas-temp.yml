name: TEMP V4 Canvas Verify

on:
  push:
    branches:
      - codex/hotfix-v4-canvas-60hz

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[canvas-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/hotfix-v4-canvas-60hz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pillow numpy opencv-python-headless
      - run: python scripts/generate-v4-sprites.py
      - name: Commit resized generated sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sprites-v4
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "[canvas-generated] art(animation): regenerate mobile-safe V4 sheets"
            git push origin HEAD:codex/hotfix-v4-canvas-60hz
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
