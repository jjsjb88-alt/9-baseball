name: GM12 Visual Verify

on:
  push:
    branches:
      - codex/visual-loop1-batter-gm12

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full tests
        run: pnpm test

      - name: Run first-pitcher smoke
        run: node scripts/zone-report.js 10

      - name: Run V9 run smoke
        run: node scripts/v9-report.js 30

      - name: Run growth smoke
        run: node scripts/growth-report.js 2

      - name: Run deck/relic smoke
        run: node scripts/deck-report.js 1

      - name: Run V11 stack simulation smoke
        run: node scripts/report-v11-stack.mjs 20

      - name: Run V11 starter simulation smoke
        run: node scripts/report-v11-starter.mjs 20

      - name: Build production site
        run: pnpm run build
