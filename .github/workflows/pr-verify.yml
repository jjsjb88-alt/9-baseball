name: PR Verify

# Every pull request into main (Antigravity loop PRs included) must pass the same gate a
# contributor runs locally: full tests, the smoke report, and the production build.
# See docs/ANTIGRAVITY-LOOP.md §3 ⑥ and §6.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard — no focused or skipped tests
        run: |
          if grep -rnE '\b(it|describe|test)\.(only|skip)\(' tests/; then
            echo "::error::Remove .only/.skip from tests (docs/ANTIGRAVITY-LOOP.md X3)"; exit 1
          fi

      - name: Run tests
        run: pnpm test

      - name: Smoke report
        run: node scripts/zone-report.js 10

      - name: Build production site
        run: pnpm run build
