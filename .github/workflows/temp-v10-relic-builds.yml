name: TEMP V10 Relic Build

on:
  push:
    branches:
      - codex/v10-relic-builds
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: codex/v10-relic-builds
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply relic patch
        run: node scripts/apply-v10-relic-builds.mjs

      - name: Run tests
        run: pnpm test

      - name: First-pitcher smoke
        run: node scripts/zone-report.js 10

      - name: Main-run draft smoke
        run: node scripts/v9-report.js 30

      - name: Growth smoke
        run: node scripts/growth-report.js 2

      - name: Deck/relic smoke
        run: node scripts/deck-report.js 1

      - name: Production build
        run: pnpm run build

      - name: Commit verified implementation
        run: |
          git config user.name "jjsjb88-alt"
          git config user.email "jjsjb88@gmail.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "feat(v10): restore build-defining relics"
          git push origin HEAD:codex/v10-relic-builds
