name: Impact Analysis Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  impact-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Collect changed files
        id: changed
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            core.setOutput('files', JSON.stringify(files.map(file => file.filename)));

      - name: Validate mandatory impact analysis
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGED_FILES_JSON: ${{ steps.changed.outputs.files }}
        run: node scripts/check-impact-analysis.mjs
