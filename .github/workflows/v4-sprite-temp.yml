name: TEMP Generate V4 60-frame Sprites

on:
  push:
    branches:
      - codex/hotfix-v4-real-60frame-sprites

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[v4-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/hotfix-v4-real-60frame-sprites
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pillow numpy opencv-python-headless
      - run: python scripts/generate-v4-sprites.py
      - name: Commit generated sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sprites-v4
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "[v4-generated] art(animation): generate 60-frame pixel sprite sheets"
            git push origin HEAD:codex/hotfix-v4-real-60frame-sprites
          fi
