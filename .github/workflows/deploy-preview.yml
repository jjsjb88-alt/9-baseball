name: Deploy V9 Preview

on:
  push:
    branches:
      - codex/v9-deckbuilder
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable main
        uses: actions/checkout@v6
        with:
          ref: main
          path: stable

      - name: Check out V9 preview
        uses: actions/checkout@v6
        with:
          ref: codex/v9-deckbuilder
          path: preview-src

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build stable root
        working-directory: stable
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Verify V9 preview
        working-directory: preview-src
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          node scripts/v9-report.js 30

      - name: Build V9 preview subpath
        working-directory: preview-src
        env:
          VITE_BASE: /9-baseball/preview/
        run: pnpm run build

      - name: Compose stable root plus preview
        run: |
          mkdir -p site/preview
          cp -a stable/dist/. site/
          cp -a preview-src/dist/. site/preview/
          test -f site/index.html
          test -f site/preview/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    runs-on: ubuntu-latest
    needs: build-preview
    steps:
      - name: Deploy stable root plus V9 preview
        id: deployment
        uses: actions/deploy-pages@v4
