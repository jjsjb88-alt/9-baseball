name: Export V4 Actor Reference

on:
  push:
    branches:
      - codex/visual-loop1-batter-gm12
    paths:
      - .github/workflows/export-v4-actor-reference.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-artifact@v4
        with:
          name: v4-actor-reference
          path: |
            assets/sprites-v4/batter-swing-60.png
            assets/sprites-v4/batter-miss-60.png
            assets/sprites-v4/batter-homer-60.png
            assets/sprites-v4/pitcher-pitch-60.png
            assets/sprites-v4/pitcher-strikeout-60.png
          if-no-files-found: error
          retention-days: 1
