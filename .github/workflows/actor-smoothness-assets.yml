name: Build actor smoothness assets

on:
  push:
    branches:
      - codex/actor-animation-runtime-smoothness
    paths:
      - scripts/generate-batter-motion-v4.py
      - .github/workflows/actor-smoothness-assets.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image build dependencies
        run: pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Generate 60-frame V3 batter atlases
        run: python scripts/generate-batter-motion-v4.py
      - name: Upload generated atlases for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: batter-v3-60hz-atlases
          path: assets/batter-reboot-v4/
      - name: Commit generated runtime assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/batter-reboot-v4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "art(runtime): generate 60-frame V3 batter atlases"
          git push origin HEAD:codex/actor-animation-runtime-smoothness
