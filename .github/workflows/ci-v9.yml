name: V9 Deckbuilder CI

on:
  push:
    branches:
      - codex/v9-deckbuilder
      - codex/sts-landscape-battleboard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run first-pitcher smoke report
        run: node scripts/zone-report.js 10

      - name: Run V9 main-run draft smoke report
        run: node scripts/v9-report.js 30

      - name: Run showcase growth smoke report
        run: node scripts/growth-report.js 2

      - name: Run showcase deck/relic smoke report
        run: node scripts/deck-report.js 1

      - name: Build production site
        run: pnpm run build
