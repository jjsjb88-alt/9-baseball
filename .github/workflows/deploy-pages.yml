name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - V9 Deckbuilder CI
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable main
        uses: actions/checkout@v6
        with:
          ref: main
          path: stable

      - name: Check out V9 preview
        uses: actions/checkout@v6
        with:
          ref: codex/v9-deckbuilder
          path: preview-src

      - name: Check out GM12 preview
        uses: actions/checkout@v6
        with:
          ref: codex/gm12-batter-golden-master-redraw
          path: gm12-src

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build stable root
        working-directory: stable
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build V9 preview subpath
        working-directory: preview-src
        env:
          VITE_BASE: /9-baseball/preview/
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build GM12 preview subpath
        working-directory: gm12-src
        env:
          VITE_BASE: /9-baseball/gm12/
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Compose stable root plus previews
        run: |
          mkdir -p site/preview site/gm12
          cp -a stable/dist/. site/
          cp -a preview-src/dist/. site/preview/
          cp -a gm12-src/dist/. site/gm12/
          test -f site/index.html
          test -f site/preview/index.html
          test -f site/gm12/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy stable root plus previews
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm GM12 playable preview
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'verify GM12 preview deployment marker')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/82/comments \
            -f body='✅ GM12 PLAYABLE PREVIEW DEPLOYED — https://jjsjb88-alt.github.io/9-baseball/gm12/ — source: codex/gm12-batter-golden-master-redraw'
