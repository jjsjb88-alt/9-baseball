name: Deploy GM12 Preview

on:
  push:
    branches:
      - codex/gm12-batter-golden-master-redraw
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable main
        uses: actions/checkout@v6
        with:
          ref: main
          path: stable

      - name: Check out existing V9 preview
        uses: actions/checkout@v6
        with:
          ref: codex/v9-deckbuilder
          path: v9-preview

      - name: Check out GM12 preview
        uses: actions/checkout@v6
        with:
          ref: codex/gm12-batter-golden-master-redraw
          path: gm12-preview

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build stable root
        working-directory: stable
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Preserve existing V9 preview
        working-directory: v9-preview
        env:
          VITE_BASE: /9-baseball/preview/
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build GM12 playable preview
        working-directory: gm12-preview
        env:
          VITE_BASE: /9-baseball/gm12/
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Compose stable root plus previews
        run: |
          mkdir -p site/preview site/gm12
          cp -a stable/dist/. site/
          cp -a v9-preview/dist/. site/preview/
          cp -a gm12-preview/dist/. site/gm12/
          test -f site/index.html
          test -f site/preview/index.html
          test -f site/gm12/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}gm12/
    runs-on: ubuntu-latest
    needs: build-preview
    steps:
      - name: Deploy stable root plus GM12 preview
        id: deployment
        uses: actions/deploy-pages@v4
