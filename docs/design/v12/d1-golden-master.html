<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>V12 D1 Golden Master</title>
<!--
  V12 D1 GOLDEN MASTER v2 — decision-only static key screen (390×844). Not runtime code.

  ONE PIXEL GRID. The whole screen is painted on a 195×422 art canvas shown at exactly 2×.
  The DUGOUT authored originals (stadium / batter / pitcher, assets/duel) are re-sampled onto
  that grid here at load time — majority vote per cell, shared palette, rebuilt 1px ink,
  backlight rim from the sunset — so actors, field and UI share one pixel size and one light.
  Hangul sits on a hard-edged 1× text layer (no anti-aliased smear) above it.

  Every lit cell, link and % comes from gm/gm-state.json (gm-state.mjs → real engine, C1~C6).
  v1 (CSS collage) is kept at gm/d1-golden-master-v1.html for comparison.
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#07060c}
.stage{position:relative;width:390px;height:844px;overflow:hidden}
canvas{position:absolute;left:0;top:0}
#art{image-rendering:pixelated;image-rendering:crisp-edges}
#art,#txt{width:390px;height:844px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main class="stage" aria-label="9ZONE 대표 전투 화면 · 결정용 정적 시안">
  <canvas id="art" width="195" height="422" aria-hidden="true"></canvas>
  <canvas id="txt" width="780" height="1688" aria-hidden="true"></canvas>
  <div class="sr" id="sr"></div>
</main>
<script src="gm/pixel-kit.js"></script>
<script src="gm/scene.js"></script>
</body>
</html>
