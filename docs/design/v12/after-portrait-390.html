<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>After</title>
<style>
:root{
  --s0:#07120f; --s1:#07141b; --s2:#132b33; --s3:#10252d; --edge:#235060;
  --ink1:#f4ecd8; --ink2:#ccd8d0; --ink3:#7d9388;
  --gold:#ffe4a2; --bone:#ded6b9; --rust:#aa7e67;
  --aim:#ffe4a2; --cover-main:#ffd98a; --cover-sup:#6fd7c6;
  --link-on:#6fd7c6; --link-off:#8a5b52; --ghost:#ffb46a; --dim:#2a3d44;
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;
  --t-h3:18px; --t-body:15px; --t-label:13px; --t-micro:12px;
  --e:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--s0);
 font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;color:var(--ink2);
 letter-spacing:0;-webkit-font-smoothing:antialiased}
.wrap{display:flex;flex-direction:column;height:844px}

/* 1 status 44 */
.status{height:44px;display:flex;align-items:center;gap:var(--sp3);padding:0 var(--sp4);
 background:linear-gradient(180deg,#0b1d22,#07141b);border-bottom:1px solid #12313a;flex:0 0 44px}
.batter{font-size:var(--t-label);color:var(--ink1);font-weight:700;letter-spacing:-.01em}
.count{margin-left:auto;display:flex;gap:10px;align-items:center}
.cg{display:flex;align-items:center;gap:3px}
.cg b{font-size:var(--t-micro);color:var(--ink3);font-weight:600;width:9px}
.cg i{width:7px;height:7px;border-radius:50%;border:1px solid #2d4a52;display:block}
.cg i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px rgba(255,228,162,.6)}
.cg.o i.on{background:var(--rust);border-color:var(--rust);box-shadow:0 0 6px rgba(170,126,103,.5)}

/* 2 field 228 */
.field{flex:0 0 196px;position:relative;overflow:hidden;
 background:radial-gradient(120% 90% at 50% 18%,#173a32 0%,#0d2420 46%,#07120f 100%)}
.field:after{content:"";position:absolute;inset:0;
 background:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);pointer-events:none}
.pitcher{position:absolute;right:14px;bottom:6px;width:116px;image-rendering:pixelated;
 filter:drop-shadow(0 8px 14px rgba(0,0,0,.65))}
.batter-art{position:absolute;left:6px;bottom:4px;width:106px;image-rendering:pixelated;
 filter:drop-shadow(0 8px 14px rgba(0,0,0,.65))}
.intent{position:absolute;top:14px;left:50%;transform:translateX(-50%);
 padding:6px 16px;border-radius:999px;background:rgba(7,20,27,.82);border:1px solid #2d5e5a;
 font-size:var(--t-label);color:var(--gold);font-weight:700;letter-spacing:.01em;
 box-shadow:0 0 22px rgba(111,215,198,.14)}
.intent-arrow{position:absolute;top:44px;left:50%;transform:translateX(-50%);opacity:.75}

/* 3 hp + ghost 56 */
.hp{flex:0 0 54px;padding:8px var(--sp4) 0;background:var(--s1)}
.hptrack{height:18px;border-radius:3px;background:#0b1f26;border:1px solid #17404a;
 position:relative;overflow:hidden;display:flex}
.hpfill{width:74%;background:linear-gradient(180deg,#63c9a7,#2f8f78)}
.hpghost{width:13%;background:
 repeating-linear-gradient(45deg,rgba(255,180,106,.85) 0 3px,rgba(255,180,106,.22) 3px 7px);
 border-right:1px solid rgba(255,180,106,.9)}
.hpcrit{width:4%;background:repeating-linear-gradient(45deg,rgba(255,180,106,.45) 0 2px,transparent 2px 6px);
 border-right:1px dashed rgba(255,228,162,.9)}
.hpmark{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18)}
.hpcap{display:flex;justify-content:space-between;margin-top:5px}
.hpcap span{font-size:var(--t-micro);color:var(--ink3);font-weight:600}
.pips{display:flex;gap:5px;align-items:center}
.pips i{width:9px;height:9px;border-radius:2px;border:1px solid #2d4a52;display:block}
.pips i.on{background:var(--gold);border-color:var(--gold)}

/* 4 board */
.board{flex:0 0 302px;position:relative;padding:10px var(--sp4) 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:relative}
.cell{height:92px;border-radius:6px;border:1px solid #1d3f48;background:#0c2027;position:relative;
 display:flex;align-items:center;justify-content:center;transition:all .18s var(--e)}
.cell.dead{background:#081418;border-color:#122b32;box-shadow:none}
.cell.dead:after{content:"";position:absolute;left:50%;top:50%;width:14px;height:1px;background:#1b3a42;transform:translate(-50%,-50%)}
.cell.heat1:before,.cell.heat2:before,.cell.heat3:before{content:"";position:absolute;inset:3px;border-radius:4px}
.cell.heat1:before{background:rgba(255,196,120,.05);box-shadow:inset 0 0 18px rgba(255,180,110,.06)}
.cell.heat2:before{background:rgba(255,190,110,.10);box-shadow:inset 0 0 22px rgba(255,170,100,.14)}
.cell.heat3:before{background:rgba(255,178,96,.18);box-shadow:inset 0 0 26px rgba(255,160,80,.26)}
.cell.main{border:2px solid var(--cover-main);background:#15303a;
 box-shadow:0 0 0 1px rgba(255,217,138,.25),0 0 22px rgba(255,217,138,.22) inset}
.cell.sup{border:1px dashed var(--cover-sup);background:#0f2b31;
 box-shadow:0 0 18px rgba(111,215,198,.16) inset}
.tok{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font-size:var(--t-label);font-weight:800;position:relative;z-index:3}
.tok.m{background:var(--cover-main);color:#1b1206;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.tok.s{background:var(--cover-sup);color:#062621;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.arc{position:absolute;inset:10px 16px 0;pointer-events:none;z-index:2}

/* 5 actions */
.acts{flex:0 0 56px;display:flex;gap:var(--sp2);padding:8px var(--sp4) 0}
.act{flex:1;height:48px;border-radius:8px;border:1px solid #1d3f48;background:#0c2027;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.act.on{border-color:var(--gold);background:#17323a;box-shadow:0 0 18px rgba(255,228,162,.14)}
.act svg{width:20px;height:20px}
.act span{font-size:var(--t-micro);color:var(--ink2);font-weight:600}
.act.on span{color:var(--gold)}

/* 6 hand */
.hand{flex:0 0 140px;display:flex;gap:var(--sp2);padding:10px var(--sp4) 12px;overflow:hidden}
.card{flex:0 0 106px;height:118px;border-radius:8px;background:linear-gradient(180deg,#e9e2c8,#ccc3a4);
 border:1px solid #8d8468;padding:8px;display:flex;flex-direction:column;gap:6px;position:relative}
.card.used{opacity:.42;filter:grayscale(.5)}
.card strong{font-size:var(--t-label);color:#1b2a2e;font-weight:800;letter-spacing:-.01em}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:auto}
.mini i{aspect-ratio:1;background:#b9b096;border-radius:1px;display:block}
.mini i.f{background:#1f6f60}
.role{position:absolute;top:8px;right:8px;width:16px;height:16px;opacity:.75}
</style></head><body><div class="wrap">

<div class="status">
  <div class="batter">#7 강한결</div>
  <div class="count">
    <div class="cg"><b>B</b><i class="on"></i><i></i><i></i><i></i></div>
    <div class="cg"><b>S</b><i class="on"></i><i></i><i></i></div>
    <div class="cg o"><b>O</b><i class="on"></i><i></i><i></i></div>
  </div>
</div>

<div class="field">
  <img class="batter-art" src="file:///home/user/9-baseball/assets/sprites-v2/frames/batter-swing-02.png">
  <img class="pitcher" src="file:///home/user/9-baseball/assets/sprites-v2/frames/pitcher-pitch-04.png">
  <div class="intent">바깥쪽</div>
  <svg class="intent-arrow" width="46" height="26" viewBox="0 0 46 26"><path d="M4 6 C20 6 30 16 42 20" stroke="#ffe4a2" stroke-width="2" fill="none" opacity=".8" stroke-dasharray="4 4"/><path d="M36 14 L43 20 L35 23" stroke="#ffe4a2" stroke-width="2" fill="none"/></svg>

  <div class="hptrack">

<div class="board">

    <path d="M179 144 C214 132 262 132 300 144" stroke="#6fd7c6" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#g)" opacity=".95"/>
    <path d="M300 144 C258 176 216 200 188 216" stroke="#8a5b52" stroke-width="4" fill="none" stroke-linecap="round" opacity=".75"/>
    <path d="M124 236 C112 240 92 241 72 242" stroke="#8a5b52" stroke-width="4" fill="none" stroke-linecap="round" opacity=".75"/>
    <circle cx="176" cy="220" r="2.4" fill="#b97a68" opacity=".9"/>

</div>

<div class="acts">
  <div class="act"><svg viewBox="0 0 24 24" fill="none" stroke="#ccd8d0" stroke-width="1.8"><path d="M5 13c0-4 3-7 7-7s7 3 7 7v5H5z"/><path d="M9 18v2M15 18v2"/></svg><span>준비</span></div>

  <div class="act"><svg viewBox="0 0 24 24" fill="none" stroke="#ccd8d0" stroke-width="1.8"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg><span>지켜보기</span></div>
</div>

<div class="hand">

    <svg class="role" viewBox="0 0 24 24" fill="none" stroke="#3b4a42" stroke-width="2"><path d="M4 20L17 7"/></svg>
    <div class="mini"><i></i><i></i><i></i><i></i><i class="f"></i><i></i><i></i><i></i><i></i></div></div>
  <div class="card used"><strong>정타 노림</strong>
    <svg class="role" viewBox="0 0 24 24" fill="none" stroke="#3b4a42" stroke-width="2"><path d="M4 20L17 7"/></svg>
    <div class="mini"><i></i><i></i><i></i><i></i><i></i><i class="f"></i><i></i><i></i><i></i></div></div>
  <div class="card"><strong>밀어치기</strong>

    <div class="mini"><i></i><i></i><i class="f"></i><i></i><i></i><i class="f"></i><i></i><i></i><i class="f"></i></div></div>

    <svg class="role" viewBox="0 0 24 24" fill="none" stroke="#3b4a42" stroke-width="2"><circle cx="12" cy="12" r="7"/></svg>
    <div class="mini"><i></i><i class="f"></i><i></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i class="f"></i><i></i></div></div>
</div>

</div></body></html>
