<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>V12 D1 Golden Master</title>
<!--
  V12 D1 GOLDEN MASTER — decision-only static key screen (390×844).
  Not a prototype, not runtime code. Every lit cell, link and % comes from
  docs/design/v12/gm/gm-state.json, generated by gm-state.mjs through the real engine (C1~C6).
  Actors/stadium: the DUGOUT authored pixel set (assets/duel), one art family, one light.
-->
<style>
:root{
  --night:#0b0f1f; --ink:#f6eedb; --muted:#b9b2a3; --dim:#7f8a8c;
  --chalk:#f3ead4; --clay:#b8653c; --clay-deep:#6c3420; --seam:#c8393a;
  --gold:#ffd27a; --gold-deep:#c98a2c; --teal:#5fd6c4; --teal-deep:#1f7f75;
  --ember:255,150,70; --glass:rgba(12,20,34,.34);
  --f:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif; --mono:ui-monospace,Consolas,"Malgun Gothic",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--night)}
body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.px{image-rendering:pixelated}
.stage{position:relative;width:390px;height:844px;overflow:hidden;isolation:isolate}

/* ── 1. SPACE: one authored stadium, camera from behind home plate ───────────── */
.sky{position:absolute;left:-340px;top:-132px;width:1070px;height:602px;
  background:url(../../../../assets/duel/stadium.png) 0 0/100% 100% no-repeat;image-rendering:pixelated;z-index:0}
/* floodlights live just off-frame: their cones set the key light for every layer */
.flood{position:absolute;z-index:1;pointer-events:none;mix-blend-mode:screen}
.flood.l{left:-120px;top:-90px;width:330px;height:560px;transform:rotate(-14deg);
  background:linear-gradient(180deg,rgba(255,236,190,.16),rgba(255,214,150,.04) 55%,transparent);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
.flood.r{right:-140px;top:-90px;width:330px;height:560px;transform:rotate(16deg);
  background:linear-gradient(180deg,rgba(255,236,190,.12),rgba(255,214,150,.03) 55%,transparent);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
.flare{position:absolute;z-index:1;width:12px;height:12px;border-radius:2px;background:#fff6dc;
  box-shadow:0 0 0 3px rgba(255,240,200,.35),0 0 26px 10px rgba(255,220,160,.5)}
/* the clay near the camera: dug-in batter's box, chalk, the dark lip before the tray */
.near-clay{position:absolute;z-index:2;left:0;right:0;top:300px;height:320px;
  background:
    radial-gradient(60% 40% at 30% 58%,rgba(0,0,0,.35),transparent 70%),
    linear-gradient(180deg,rgba(108,52,32,0),rgba(84,40,24,.55) 38%,rgba(28,14,12,.96) 88%)}
.chalk{position:absolute;z-index:3;height:3px;background:rgba(243,234,212,.55);image-rendering:pixelated;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.haze{position:absolute;z-index:4;left:0;right:0;top:214px;height:90px;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(255,196,140,.10) 45%,transparent)}

/* ── 2. DIEGETIC HUD: the outfield scoreboard carries the opponent ─────────────── */
.board{position:absolute;z-index:5;left:117px;top:96px;width:156px;height:58px;
  background:#0c1714;border:2px solid #1c2c27;box-shadow:inset 0 0 0 1px #2f4a41,0 0 18px rgba(0,0,0,.5)}
.board:before{content:"";position:absolute;inset:3px;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
.board .name{position:absolute;left:8px;top:5px;font:800 11px/1 var(--f);letter-spacing:.02em;color:#ffe9b8;text-shadow:0 0 6px rgba(255,190,90,.8)}
.board .type{position:absolute;right:7px;top:6px;font:700 9px/1 var(--f);color:#8fd9c6}
.board .hp{position:absolute;left:8px;right:8px;top:21px;height:7px;background:#1b0d0a;border:1px solid #3a1d15}
.board .hp i{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ff8a4c 0 5px,#ffb070 5px 6px,#1b0d0a 6px 7px);box-shadow:0 0 8px rgba(255,138,76,.8)}
.board .hpn{position:absolute;left:8px;top:34px;font:900 13px/1 var(--mono);color:#ffcf8f;text-shadow:0 0 6px rgba(255,150,70,.9)}
.board .hpn small{font-size:9px;color:#b8876a;letter-spacing:-.02em}
.board .cnt{position:absolute;right:7px;top:36px;display:flex;gap:5px;font:800 9px/1 var(--mono);color:#8fa59d}
.board .cnt span{display:flex;gap:2px;align-items:center}.board .cnt b{flex:none;width:5px;height:5px;border-radius:50%;background:#34463f;display:block}
.board .cnt b.g{background:#6fe39a;box-shadow:0 0 4px #6fe39a}.board .cnt b.y{background:#ffd27a;box-shadow:0 0 4px #ffd27a}

/* ── 3. THE DUEL: pitcher far on the mound, batter close to camera ─────────────── */
.mound{position:absolute;z-index:5;left:146px;top:250px;width:112px;height:22px;border-radius:50%;
  background:radial-gradient(50% 50% at 50% 45%,#c9824f 0 42%,#9b5634 60%,rgba(108,52,32,0) 100%)}
.pitcher{position:absolute;z-index:6;left:171px;top:160px;height:102px;image-rendering:pixelated;
  filter:drop-shadow(1px 0 0 rgba(255,226,170,.6)) drop-shadow(-1px 0 0 rgba(255,226,170,.6)) drop-shadow(0 0 8px rgba(255,200,140,.3))}
.pshadow{position:absolute;z-index:5;left:178px;top:254px;width:46px;height:7px;border-radius:50%;background:rgba(20,8,4,.55)}
.release{position:absolute;z-index:7;left:231px;top:162px;width:9px;height:9px;border-radius:50%;background:#fff7e0;
  box-shadow:0 0 0 3px rgba(255,236,190,.28),0 0 14px 4px rgba(255,220,150,.6)}
.intent{position:absolute;z-index:8;left:258px;top:176px;white-space:nowrap;padding:5px 8px 5px 7px;border-radius:3px;
  background:rgba(16,10,6,.72);border:1px solid rgba(255,196,120,.5);font:800 12px/1 var(--f);color:var(--gold);
  box-shadow:0 0 14px rgba(255,160,80,.25)}
.intent small{display:block;margin-top:3px;font:600 10px/1 var(--f);color:#d6b893}
.intent:before{content:"";position:absolute;left:-6px;top:9px;border:5px solid transparent;border-right-color:rgba(255,196,120,.5);border-left:0}

.batter{position:absolute;z-index:12;left:-78px;top:262px;height:400px;image-rendering:pixelated;
  filter:drop-shadow(2px -1px 0 rgba(255,222,170,.55)) drop-shadow(0 18px 18px rgba(0,0,0,.55))}
.bshadow{position:absolute;z-index:11;left:-30px;top:630px;width:250px;height:26px;border-radius:50%;background:rgba(10,4,2,.6);filter:blur(1px)}

/* the ball's path from the release point: it fades out before the zone (C5 — no arrival leak) */
.path{position:absolute;z-index:9;left:170px;top:150px;width:120px;height:170px;pointer-events:none}

/* ── 4. 9ZONE: the signature object — a lit strike-zone frame over home plate ─── */
.nz{position:absolute;z-index:14;left:163px;top:290px;width:212px;height:248px}
.nz .frame{position:absolute;inset:0;border:2px solid rgba(255,236,196,.9);
  box-shadow:0 0 0 1px rgba(40,20,10,.8),0 0 22px rgba(255,210,140,.35),inset 0 0 30px rgba(255,200,130,.08);
  background:linear-gradient(180deg,rgba(18,26,40,.18),rgba(18,26,40,.30))}
/* corner brackets: the "zone" read even at thumbnail size */
.nz .frame i{position:absolute;width:16px;height:16px;border:3px solid var(--gold)}
.nz .frame i:nth-child(1){left:-6px;top:-6px;border-right:0;border-bottom:0}
.nz .frame i:nth-child(2){right:-6px;top:-6px;border-left:0;border-bottom:0}
.nz .frame i:nth-child(3){left:-6px;bottom:-6px;border-right:0;border-top:0}
.nz .frame i:nth-child(4){right:-6px;bottom:-6px;border-left:0;border-top:0}
.nz .tab{position:absolute;left:50%;top:-23px;transform:translateX(-50%);height:18px;padding:0 9px 0 7px;display:flex;align-items:center;gap:5px;
  background:linear-gradient(180deg,#ffe3a0,#d99a3a);color:#23140a;font:900 11px/1 var(--f);letter-spacing:.14em;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 100%,0 100%)}
.nz .tab b{font-size:13px;letter-spacing:0}
.nz .axis{position:absolute;font:700 9px/1 var(--f);color:rgba(246,238,219,.7);letter-spacing:.06em;text-shadow:0 1px 2px #000}
.nz .axis.in{left:8px;top:-15px}.nz .axis.out{right:8px;top:-15px}
.grid{position:absolute;left:4px;top:4px;width:200px;height:200px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:3px}
.c{position:relative;border:1px solid rgba(246,238,219,.18);background:var(--glass)}
/* layer 1 — read shade (level 0 = three allowed shades only, never "0%") */
.c[data-shade="1"]{background:rgba(var(--ember),.07)}
.c[data-shade="2"]{background:rgba(var(--ember),.20)}
.c[data-shade="3"]{background:rgba(var(--ember),.34)}
/* layer 2 — coverage from coverageAt(): translucent fill + edge, never opaque */
.c.cm{background-image:linear-gradient(rgba(255,210,122,.34),rgba(255,190,90,.22));border:2px solid var(--gold);box-shadow:inset 0 0 12px rgba(255,210,122,.25)}
.c.cs{box-shadow:inset 0 0 0 2px var(--teal),inset 0 0 14px rgba(95,214,196,.25)}
.c.cm.cs{box-shadow:inset 0 0 0 4px rgba(95,214,196,.95),inset 0 0 14px rgba(95,214,196,.25)}
/* cell coordinate 1~9: small square numeral, a different shape from order tokens */
.c .k{position:absolute;left:3px;top:3px;font:800 9px/1 var(--mono);color:rgba(246,238,219,.62)}
/* broadcast K-zone ticks: the zone's thirds are marked outside the frame like a TV strike zone */
.nz .tick{position:absolute;background:var(--gold);box-shadow:0 0 6px rgba(255,210,122,.7)}
.nz .tick.l{left:-11px;width:7px;height:2px}.nz .tick.r{right:-11px;width:7px;height:2px}
.nz .tick.b{bottom:-11px;width:2px;height:7px}
/* inner hairline: the frame reads as a lit tube, not a CSS border */
.nz .frame:after{content:"";position:absolute;inset:2px;border:1px solid rgba(255,244,214,.35);pointer-events:none}
.c .k{display:grid;place-items:center;width:13px;height:13px;border:1px solid rgba(246,238,219,.28);background:rgba(8,8,14,.45)}
/* layer 3 — order tokens at each aimZone: ① main gold disc, ②③ teal discs */
.tok{position:absolute;z-index:3;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:900 13px/1 var(--f);
  left:50%;top:50%;transform:translate(-50%,-50%)}
.tok.m{background:radial-gradient(circle at 35% 30%,#fff1c4,#ffcf6a 55%,#c98a2c);color:#2a1706;box-shadow:0 0 0 2px #2a1706,0 0 14px rgba(255,210,122,.8)}
.tok.s{background:radial-gradient(circle at 35% 30%,#c9fff5,#5fd6c4 55%,#1f7f75);color:#062521;box-shadow:0 0 0 2px #062521,0 0 12px rgba(95,214,196,.7)}
/* layer 4 — order links from stackPlan.links (5→4, 4→2 both connected) */
.links{position:absolute;left:4px;top:4px;width:200px;height:200px;z-index:2;pointer-events:none;overflow:visible}
/* home plate the frame stands on: the board's anchor into the field */
.plate{position:absolute;z-index:13;left:196px;top:530px;width:146px;height:36px}
/* light the zone throws down onto the plate: the board belongs to the field */
.beam{position:absolute;z-index:13;left:170px;top:470px;width:198px;height:80px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,214,150,0),rgba(255,214,150,.16));clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}
.readout{position:absolute;left:4px;right:4px;bottom:4px;height:32px;display:flex;gap:4px;
  border-top:1px solid rgba(255,236,196,.28);padding-top:4px}
.chip{flex:1;justify-content:center;height:26px;padding:0 6px;display:flex;align-items:center;gap:6px;border-radius:3px;background:rgba(10,10,14,.78);
  border:1px solid rgba(246,238,219,.2);font:700 11px/1 var(--f);color:#ddd4c2;white-space:nowrap}
.chip b{font:900 14px/1 var(--f);color:var(--gold)}
.chip.link b{color:var(--teal)}
.chip small{font-size:10px;color:var(--dim);font-weight:700}

/* ── 5. HAND: home-plate-shaped cards with a seam edge ─────────────────────────── */
.tray{position:absolute;z-index:17;left:0;right:0;top:572px;bottom:0;
  background:linear-gradient(180deg,rgba(14,8,6,0),rgba(14,8,6,.82) 26px,#0e0907 60px);}
.tray:before{content:"";position:absolute;left:0;right:0;top:24px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,210,122,.35),transparent)}
.handlabel{position:absolute;z-index:18;left:14px;top:590px;font:800 10px/1 var(--f);letter-spacing:.16em;color:#a79a86}
.handlabel b{color:var(--gold);letter-spacing:.02em;font-size:11px;margin-left:6px}
.hand{position:absolute;z-index:19;left:10px;right:10px;top:628px;display:flex;justify-content:space-between}
.card{position:relative;width:68px;height:104px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}
.card .body{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);
  background:linear-gradient(170deg,#fbf3de,#e7dabb 60%,#cdb98f);}
/* seam edge: two rows of red stitches along the left shoulder of every card */
.card .body:before{content:"";position:absolute;left:4px;top:6px;bottom:30px;width:5px;
  background:repeating-linear-gradient(180deg,var(--seam) 0 3px,transparent 3px 7px);opacity:.85;
  -webkit-mask:linear-gradient(90deg,#000 0 2px,transparent 2px 3px,#000 3px);mask:linear-gradient(90deg,#000 0 2px,transparent 2px 3px,#000 3px)}
.card .body:after{content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);
  box-shadow:inset 0 0 0 1px rgba(90,60,30,.55),inset 0 -14px 18px rgba(120,70,30,.22)}
.card .nm{position:absolute;left:11px;right:2px;top:8px;font:900 12px/1 var(--f);color:#1c160f;letter-spacing:-.05em;white-space:nowrap}
.card .mini{position:absolute;left:20px;top:27px;width:32px;height:32px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:2px}
.card .mini i{background:#cbbb97;border-radius:1px}.card .mini i.on{background:#2c5f58}
.card .role{position:absolute;left:8px;right:0;top:64px;text-align:center;font:800 9px/1 var(--f);color:#6d5a40;letter-spacing:.06em}
/* in the stack: lifted, lit edge and the same order token as the board */
.card.in{transform:translateY(-12px)}
.card.in .body{background:linear-gradient(170deg,#fff8e6,#f1e3bf 60%,#d8c08a)}
.card.in.m .body:after{box-shadow:inset 0 0 0 2px var(--gold-deep),inset 0 -14px 18px rgba(200,130,40,.3)}
.card.in.s .body:after{box-shadow:inset 0 0 0 2px var(--teal-deep),inset 0 -14px 18px rgba(30,130,120,.25)}
.card .ord{position:absolute;z-index:2;left:50%;bottom:-9px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;font:900 12px/1 var(--f)}
.card.m .ord{background:radial-gradient(circle at 35% 30%,#fff1c4,#ffcf6a 55%,#c98a2c);color:#2a1706;box-shadow:0 0 0 2px #2a1706}
.card.s .ord{background:radial-gradient(circle at 35% 30%,#c9fff5,#5fd6c4 55%,#1f7f75);color:#062521;box-shadow:0 0 0 2px #062521}
.card.in .role{color:#8a5a1c}

/* ── 6. EXECUTE ───────────────────────────────────────────────────────────────── */
.actions{position:absolute;z-index:20;left:12px;right:12px;bottom:14px;height:54px;display:flex;gap:8px}
.act{height:54px;border-radius:0;border:0;background:linear-gradient(180deg,#221913,#140e0b);color:#e6dccb;box-shadow:inset 0 0 0 1px rgba(246,238,219,.18),inset 0 1px 0 rgba(255,230,190,.12);clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);
  font:800 13px/1 var(--f);display:grid;place-items:center;width:78px}
.act small{display:block;font:700 9px/1 var(--f);color:var(--dim);margin-top:3px}
.act.go{flex:1;position:relative;border:0;color:#221307;font-size:17px;letter-spacing:.04em;
  background:linear-gradient(180deg,#ffe29b,#f0b24c 55%,#c9832a);box-shadow:0 0 0 2px #2a1706,0 0 0 3px rgba(255,210,122,.55),0 0 26px rgba(255,180,80,.35);
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}
.act.go small{color:#6b3d10;font-size:10px}

/* top strip: who is up, nothing else — the scoreboard carries the opponent */
.top{position:absolute;z-index:20;left:0;right:0;top:0;height:40px;display:flex;align-items:center;padding:0 14px;gap:10px;
  background:linear-gradient(180deg,rgba(8,8,16,.8),rgba(8,8,16,0))}
.logo{font:900 13px/1 var(--f);letter-spacing:.1em;color:var(--gold)}
.logo b{display:inline-grid;place-items:center;width:15px;height:15px;margin-right:2px;background:var(--gold);color:#221307;font-size:11px;letter-spacing:0;vertical-align:-2px}
.ab{font:800 12px/1 var(--f);color:#efe6d2}.ab small{color:#a79a86;font-weight:700;margin-left:4px;font-size:10px}
.inn{margin-left:auto;font:800 10px/1 var(--f);color:#a79a86;letter-spacing:.08em}
.vignette{position:absolute;inset:0;z-index:15;pointer-events:none;
  background:radial-gradient(120% 90% at 55% 38%,transparent 55%,rgba(4,4,10,.55) 100%)}
</style>
</head>
<body>
<main class="stage" aria-label="9ZONE 대표 전투 화면 · 결정용 정적 시안">
  <!-- space -->
  <div class="sky" aria-hidden="true"></div>
  <div class="flood l"></div><div class="flood r"></div>
  <div class="near-clay"></div>
  <div class="haze"></div>
  <div class="chalk" style="left:0;top:548px;width:170px;transform:rotate(-9deg);transform-origin:right"></div>
  <div class="chalk" style="left:350px;top:560px;width:60px;transform:rotate(12deg);transform-origin:left"></div>

  <!-- diegetic opponent HUD -->
  <div class="board" role="group" aria-label="상대 투수 권재민, 바깥쪽 제구형, HP 72 / 72, 볼 0 스트라이크 0 아웃 0">
    <span class="name">권재민</span><span class="type">바깥쪽 제구형</span>
    <span class="hp"><i style="right:0"></i></span>
    <span class="hpn">72<small> / 72 HP</small></span>
    <span class="cnt"><span>B<b></b><b></b><b></b></span><span>S<b></b><b></b></span><span>O<b></b><b></b></span></span>
  </div>

  <!-- duel -->
  <div class="mound"></div><div class="pshadow"></div>
  <img class="pitcher" src="pitcher-windup.png" alt="마운드의 투수, 와인드업">
  <div class="release"></div>
  <div class="intent">바깥쪽 승부<small>투수 의도 · 예고 아님</small></div>
  <svg class="path" viewBox="0 0 120 170" aria-hidden="true">
    <defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d2" stop-opacity=".95"/><stop offset=".55" stop-color="#ffd27a" stop-opacity=".45"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></linearGradient></defs>
    <path d="M63 10 C66 55 72 95 84 150" fill="none" stroke="url(#fade)" stroke-width="3" stroke-dasharray="1 5" stroke-linecap="round"/>
  </svg>

  <div class="bshadow"></div>
  <img class="batter" src="batter-ready.png" alt="타석의 타자 #7 강한결, 준비 자세">
  <div class="vignette"></div>

  <!-- 9ZONE -->
  <section class="nz" aria-label="9ZONE 보드 · 몸쪽이 왼쪽, 바깥쪽이 오른쪽">
    <div class="frame"><i></i><i></i><i></i><i></i>
      <span class="tick l" style="top:71px"></span><span class="tick l" style="top:139px"></span>
      <span class="tick r" style="top:71px"></span><span class="tick r" style="top:139px"></span>
      <div class="tab"><b>9</b>ZONE</div>
      <div class="grid" id="grid"></div>
      <div class="readout">
        <span class="chip">피해 효율 <b id="rate">–</b></span>
        <span class="chip link">CONNECT <b id="conn">–</b></span>
      </div>
      <svg class="links" id="links" viewBox="0 0 200 200"></svg>
    </div>
    <span class="axis in">◀ 몸쪽</span><span class="axis out">바깥쪽 ▶</span>
  </section>
  <div class="beam"></div>
  <svg class="plate" viewBox="0 0 146 36" aria-hidden="true">
    <polygon points="12,4 134,4 146,16 73,34 0,16" fill="#efe6cf" stroke="#2a1a10" stroke-width="2"/>
    <polygon points="14,7 132,7 140,15 73,30 6,15" fill="none" stroke="rgba(255,210,122,.6)" stroke-width="1"/>
  </svg>

  <!-- hand -->
  <div class="tray"></div>
  <div class="handlabel">SWING ORDER<b id="count">–</b></div>
  <div class="hand" id="hand"></div>

  <nav class="actions">
    <button class="act">준비<small>집중·드로우</small></button>
    <button class="act">지켜보기<small>볼/스트라이크</small></button>
    <button class="act go">스윙 확정<small id="gosub">–</small></button>
  </nav>

  <header class="top">
    <span class="logo"><b>9</b>ZONE</span>
    <span class="ab">#7 강한결<small>1번 · 타석 1</small></span>
    <span class="inn">1막 · 정규 승부</span>
  </header>
</main>

<script>
// State is inlined from gm/gm-state.json (engine output) so the page renders from file:// too.
const S={"readLevel":0,"read":[1,1,2,1,1,2,1,1,2],
  "steps":[{"order":1,"main":true,"aimZone":5,"name":"밀어치기","shape":"column"},{"order":2,"main":false,"aimZone":4,"name":"정타 노림","shape":"point"},{"order":3,"main":false,"aimZone":2,"name":"정타 노림","shape":"point"}],
  "coverage":{"main":[2,5,8],"supports":[{"aimZone":4,"cells":[4]},{"aimZone":2,"cells":[2]}]},
  "links":[{"fromZone":5,"toZone":4,"connected":true},{"fromZone":4,"toZone":2,"connected":true}],
  "connectCount":2,"cardCount":3,"damageRate":0.79,
  "hand":[{"id":"c0","name":"정타 노림","shape":"point"},{"id":"c1","name":"정타 노림","shape":"point"},{"id":"c2","name":"정타 노림","shape":"point"},{"id":"c3","name":"정타 노림","shape":"point"},{"id":"c4","name":"밀어치기","shape":"column"}],
  "stack":{"c4":1,"c0":2,"c1":3}};

const grid=document.getElementById('grid');
const sup=new Set(S.coverage.supports.flatMap(x=>x.cells)),main=new Set(S.coverage.main);
for(let z=0;z<9;z++){
  const c=document.createElement('div');c.className='c'+(main.has(z)?' cm':'')+(sup.has(z)?' cs':'');
  c.dataset.shade=S.read[z];c.innerHTML='<span class="k">'+(z+1)+'</span>';
  const st=S.steps.find(x=>x.aimZone===z);
  if(st)c.insertAdjacentHTML('beforeend','<span class="tok '+(st.main?'m':'s')+'">'+st.order+'</span>');
  c.setAttribute('aria-label',(z+1)+'번 존'+(main.has(z)?' · 메인 커버':'')+(sup.has(z)?' · 지원 커버':'')+(st?' · '+st.order+'번 '+st.name:''));
  grid.appendChild(c);
}
// links between consecutive aimZones (cell centres in a 200×200 box with 3px gaps)
const cx=z=>(z%3)*67.7+32.3,cy=z=>Math.floor(z/3)*67.7+32.3,svg=document.getElementById('links');
S.links.forEach(l=>{
  const col=l.connected?'#5fd6c4':'rgba(246,238,219,.35)';
  svg.insertAdjacentHTML('beforeend',
    '<line x1="'+cx(l.fromZone)+'" y1="'+cy(l.fromZone)+'" x2="'+cx(l.toZone)+'" y2="'+cy(l.toZone)+'" stroke="#062521" stroke-width="7" stroke-linecap="round"/>'+
    '<line x1="'+cx(l.fromZone)+'" y1="'+cy(l.fromZone)+'" x2="'+cx(l.toZone)+'" y2="'+cy(l.toZone)+'" stroke="'+col+'" stroke-width="3" stroke-linecap="round"'+(l.connected?'':' stroke-dasharray="4 5"')+'/>');
});
document.getElementById('rate').textContent=Math.round(S.damageRate*100)+'%';
document.getElementById('conn').textContent=S.connectCount+'/'+(S.cardCount-1);
document.getElementById('count').textContent=S.cardCount+'장 · 메인 1 + 지원 '+(S.cardCount-1);
document.getElementById('gosub').textContent=S.cardCount+'장 · 1회 실행';
const shapeCells={point:[4],column:[1,4,7],row:[3,4,5],cross:[1,3,4,5,7],all:[0,1,2,3,4,5,6,7,8]};
const hand=document.getElementById('hand');
S.hand.forEach(h=>{
  const o=S.stack[h.id],m=o===1;
  const mini=Array.from({length:9},(_,i)=>'<i'+(shapeCells[h.shape].includes(i)?' class="on"':'')+'></i>').join('');
  hand.insertAdjacentHTML('beforeend','<div class="card'+(o?' in '+(m?'m':'s'):'')+'" role="button" aria-label="'+h.name+(o?' · '+o+'번 '+(m?'메인':'지원'):' · 대기')+'">'+
    '<div class="body"><span class="nm">'+h.name+'</span><span class="mini">'+mini+'</span><span class="role">'+(o?(m?'MAIN':'SUPPORT'):'대기')+'</span></div>'+
    (o?'<span class="ord">'+o+'</span>':'')+'</div>');
});
</script>
</body>
</html>
