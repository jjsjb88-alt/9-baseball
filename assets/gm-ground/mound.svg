<svg xmlns="http://www.w3.org/2000/svg" width="120" height="34" viewBox="0 0 120 34" shape-rendering="crispEdges">
<!-- 투수 마운드. 한 줄씩 직접 찍은 픽셀 런. 명암 4단: 하이라이트 / 상단면 / 전면 / 그늘 + 외곽선 -->
<defs><style>
.o{fill:#42301f}.d1{fill:#6f513d}.d2{fill:#826046}.d3{fill:#b88152}.d4{fill:#c5975f}
.r{fill:#ebe4c8}.rs{fill:#9a937c}
</style></defs>

<!-- 상단면 (빛 받는 흙) -->
<rect class="d3" x="44" y="6"  width="33" height="1"/>
<rect class="d3" x="38" y="7"  width="45" height="1"/>
<rect class="d3" x="33" y="8"  width="55" height="1"/>
<rect class="d3" x="29" y="9"  width="63" height="1"/>
<rect class="d3" x="26" y="10" width="69" height="1"/>
<rect class="d3" x="24" y="11" width="73" height="1"/>
<rect class="d3" x="22" y="12" width="77" height="1"/>
<rect class="d3" x="21" y="13" width="79" height="1"/>

<!-- 상단면 하이라이트 (좌상단에서 오는 조명) -->
<rect class="d4" x="46" y="7"  width="22" height="1"/>
<rect class="d4" x="40" y="8"  width="30" height="1"/>
<rect class="d4" x="36" y="9"  width="32" height="1"/>
<rect class="d4" x="33" y="10" width="26" height="1"/>

<!-- 전면 (수직으로 떨어지는 흙벽) -->
<rect class="d2" x="20" y="14" width="81" height="1"/>
<rect class="d2" x="19" y="15" width="83" height="1"/>
<rect class="d2" x="18" y="16" width="85" height="1"/>
<rect class="d2" x="18" y="17" width="85" height="1"/>
<rect class="d2" x="19" y="18" width="83" height="1"/>
<rect class="d2" x="20" y="19" width="81" height="1"/>

<!-- 아래로 갈수록 그늘 -->
<rect class="d1" x="22" y="20" width="77" height="1"/>
<rect class="d1" x="25" y="21" width="71" height="1"/>
<rect class="d1" x="29" y="22" width="63" height="1"/>
<rect class="d1" x="35" y="23" width="51" height="1"/>
<rect class="d1" x="43" y="24" width="35" height="1"/>

<!-- 외곽선 -->
<rect class="o" x="17" y="16" width="1" height="2"/>
<rect class="o" x="103" y="16" width="1" height="2"/>
<rect class="o" x="21" y="20" width="1" height="1"/>
<rect class="o" x="98" y="20" width="1" height="1"/>
<rect class="o" x="42" y="24" width="1" height="1"/>
<rect class="o" x="78" y="24" width="1" height="1"/>
<rect class="o" x="44" y="25" width="33" height="1"/>

<!-- 투수판 -->
<rect class="r"  x="51" y="9"  width="18" height="2"/>
<rect class="rs" x="51" y="11" width="18" height="1"/>
</svg>
